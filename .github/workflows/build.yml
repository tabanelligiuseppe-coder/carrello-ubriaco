name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm install -g @bubblewrap/cli
      - name: Init and Build
        run: |
          mkdir twa && cd twa
          bubblewrap init --manifest https://TUONOME.github.io/carrello-ubriaco/manifest.json
          bubblewrap build
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: twa/app-release-signed.apk
