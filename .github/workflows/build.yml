name: Build APK con Cordova

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Installa Cordova
        run: npm install -g cordova

      - name: Crea progetto, SOVRASCRIVI l'icona e compila
        run: |
          # 1. Crea il progetto
          cordova create app com.tuonome.carrelloubriaco "Carrello Ubriaco"
          
          # 2. Copia i file web
          cp index.html app/www/index.html
          cp manifest.json app/www/manifest.json
          cp sw.js app/www/sw.js
          
          # 3. Entra nella cartella e aggiungi la piattaforma Android
          cd app
          cordova platform add android
          
          # 4. TROVA E SOSTITUISCI A MANO TUTTE LE ICONE DI DEFAULT
          #    Questo comando cerca tutti i file "ic_launcher.png" (le icone vere)
          #    dentro la cartella di build e li rimpiazza col tuo logo.
          find platforms/android/app/src/main/res -name "ic_launcher.png" -exec cp ../logo.png {} \;
          
          # 5. Compila
          cordova build android

      - name: Carica l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
