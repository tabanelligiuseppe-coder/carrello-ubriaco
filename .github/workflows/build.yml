name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configura Bubblewrap (salta i prompt)
        run: |
          mkdir -p ~/.bubblewrap
          echo '{"jdkPath":"${{ env.JAVA_HOME }}","androidSdkPath":"${{ env.ANDROID_HOME }}"}' > ~/.bubblewrap/config.json
          bubblewrap doctor

      - name: Init and Build TWA
        run: |
          mkdir -p twa
          cd twa
          bubblewrap init --manifest https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/manifest.json --directory . --skipPwaValidation
          bubblewrap build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: twa/app-release-signed.apk
