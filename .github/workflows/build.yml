name: Build APK con Cordova

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Installa Cordova e cordova-res
        run: |
          npm install -g cordova
          npm install -g cordova-res

      - name: Crea progetto, genera icone e compila
        run: |
          cordova create app com.tuonome.carrelloubriaco "Carrello Ubriaco"
          cp index.html app/www/index.html
          cp manifest.json app/www/manifest.json
          cp sw.js app/www/sw.js
          
          mkdir -p app/resources
          cp logo.png app/resources/icon.png
          cp logo.png app/resources/splash.png
          
          cd app
          cordova-res android --skip-config --copy
          
          cordova platform add android
          
          sed -i 's|</platform>|<icon src="res/icon/android/ldpi.png" density="ldpi" /><icon src="res/icon/android/mdpi.png" density="mdpi" /><icon src="res/icon/android/hdpi.png" density="hdpi" /><icon src="res/icon/android/xhdpi.png" density="xhdpi" /><icon src="res/icon/android/xxhdpi.png" density="xxhdpi" /><icon src="res/icon/android/xxxhdpi.png" density="xxxhdpi" /></platform>|' config.xml
          
          cordova build android

      - name: Carica l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
