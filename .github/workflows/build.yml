name: Build APK con Cordova

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Installa Cordova
        run: npm install -g cordova

      - name: Crea progetto e compila APK
        run: |
          # Crea un progetto Cordova temporaneo
          cordova create app com.tuonome.carrelloubriaco "Carrello Ubriaco"
          
          # Copia i tuoi file web dentro il progetto
          cp index.html app/www/index.html
          cp manifest.json app/www/manifest.json
          cp sw.js app/www/sw.js
          cp logo.png app/www/logo.png
          
          # Entra nella cartella, aggiungi Android e compila
          cd app
          cordova platform add android
          cordova build android

      - name: Carica l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
