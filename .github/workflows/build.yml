name: Build APK con Cordova

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Installa Cordova
        run: npm install -g cordova

      - name: Crea progetto, configura icona e compila
        run: |
          # Crea il progetto
          cordova create app com.tuonome.carrelloubriaco "Carrello Ubriaco"
          
          # Copia i file dell'app
          cp index.html app/www/index.html
          cp manifest.json app/www/manifest.json
          cp sw.js app/www/sw.js
          cp logo.png app/www/logo.png
          
          # Sostituisce l'icona di default con il tuo logo
          cp logo.png app/res/icon/android/ldpi.png
          cp logo.png app/res/icon/android/mdpi.png
          cp logo.png app/res/icon/android/hdpi.png
          cp logo.png app/res/icon/android/xhdpi.png
          cp logo.png app/res/icon/android/xxhdpi.png
          cp logo.png app/res/icon/android/xxxhdpi.png
          
          # Rimuove la schermata di avvio (splash screen) di default
          rm -f app/res/screen/android/*.png
          
          # Compila l'APK
          cd app
          cordova platform add android
          cordova build android

      - name: Carica l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
