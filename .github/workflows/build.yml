name: Build APK con Cordova

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Installa Cordova
        run: npm install -g cordova

      - name: Crea progetto e compila
        run: |
          # Crea il progetto
          cordova create app com.tuonome.carrelloubriaco "Carrello Ubriaco"
          
          # Copia i file dell'app (incluso manifest e logo)
          cp index.html app/www/index.html
          cp manifest.json app/www/manifest.json
          cp sw.js app/www/sw.js
          cp logo.png app/www/logo.png
          
          # Entra nella cartella
          cd app
          
          # Aggiunge la piattaforma Android
          cordova platform add android
          
          # MODIFICA IL CONFIG.XML: Usa il logo come icona e rimuovi lo splash screen
          sed -i 's|<preference name="SplashScreen" value="screen" />||g' config.xml
          sed -i 's|<preference name="SplashScreenDelay" value="3000" />||g' config.xml
          
          # Inserisce le icone personalizzate nel config.xml
          sed -i 's|</platform>|<icon src="www/logo.png" density="ldpi" /><icon src="www/logo.png" density="mdpi" /><icon src="www/logo.png" density="hdpi" /><icon src="www/logo.png" density="xhdpi" /><icon src="www/logo.png" density="xxhdpi" /><icon src="www/logo.png" density="xxxhdpi" /></platform>|' config.xml
          
          # Compila
          cordova build android

      - name: Carica l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
