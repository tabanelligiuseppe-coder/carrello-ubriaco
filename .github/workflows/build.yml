name: Build APK con Cordova

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Installa Cordova
        run: npm install -g cordova

      - name: Crea progetto, CONFIGURA L'ICONA e compila
        run: |
          # 1. Crea il progetto
          cordova create app com.tuonome.carrelloubriaco "Carrello Ubriaco"
          
          # 2. Copia i file web
          cp index.html app/www/index.html
          cp manifest.json app/www/manifest.json
          cp sw.js app/www/sw.js
          
          # 3. Prepara la cartella delle risorse per l'icona
          mkdir -p app/res/icon/android
          cp logo.png app/res/icon/android/ldpi.png
          cp logo.png app/res/icon/android/mdpi.png
          cp logo.png app/res/icon/android/hdpi.png
          cp logo.png app/res/icon/android/xhdpi.png
          cp logo.png app/res/icon/android/xxhdpi.png
          cp logo.png app/res/icon/android/xxxhdpi.png
          
          # 4. Entra nella cartella e modifica il config.xml PRIMA di aggiungere la piattaforma
          cd app
          
          # Rimuove eventuali righe di splash screen che danno fastidio
          sed -i '/SplashScreen/d' config.xml
          
          # Aggiunge le righe <icon> nel config.xml (questo è il modo ufficiale)
          # Usiamo un blocco unico per evitare errori di sintassi
          sed -i 's|<platform name="android">|<platform name="android">\n        <icon src="res/icon/android/ldpi.png" density="ldpi" />\n        <icon src="res/icon/android/mdpi.png" density="mdpi" />\n        <icon src="res/icon/android/hdpi.png" density="hdpi" />\n        <icon src="res/icon/android/xhdpi.png" density="xhdpi" />\n        <icon src="res/icon/android/xxhdpi.png" density="xxhdpi" />\n        <icon src="res/icon/android/xxxhdpi.png" density="xxxhdpi" />|' config.xml
          
          # 5. ORA aggiunge la piattaforma Android (così legge il config.xml già modificato)
          cordova platform add android
          
          # 6. Compila
          cordova build android

      - name: Carica l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
