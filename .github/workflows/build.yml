name: Build APK con Cordova

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Installa Cordova
        run: npm install -g cordova

      - name: Crea progetto e compila
        run: |
          cordova create app com.tuonome.carrelloubriaco "Carrello Ubriaco"
          cp index.html app/www/index.html
          cp manifest.json app/www/manifest.json
          cp sw.js app/www/sw.js
          cd app
          cordova platform add android
          
          # DIAGNOSI: Prima di compilare, forziamo la copia dell'icona
          # e poi stampiamo la lista dei file immagine per vedere se c'è.
          echo "=== INIZIO DIAGNOSI ICONE ===" > ../diagnosi.txt
          find platforms/android -name "*launcher*" -o -name "*icon*" >> ../diagnosi.txt
          
          # Proviamo a sovrascrivere l'icona principale (quella che di solito si vede)
          cp ../logo.png platforms/android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp ../logo.png platforms/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp ../logo.png platforms/android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp ../logo.png platforms/android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp ../logo.png platforms/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          
          echo "=== FINE DIAGNOSI ===" >> ../diagnosi.txt
          
          cordova build android

      - name: Carica l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Carica il file di diagnosi
        uses: actions/upload-artifact@v4
        with:
          name: diagnosi
          path: diagnosi.txt
